name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: go build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The Windows leg is load-bearing for the portable verbs added by
        # lean-organizer: `parley wait` (bounded portable polling — no fsnotify)
        # and `parley usage ingest` (streaming path-only ingest) must hold on
        # Windows so releases ship Windows assets honestly.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure fixture git identity
        # release-ci-claude-1 Finding A: the evidence-refusal path
        # (internal/app commitVerificationRefusal via refusalGit) commits
        # with no git identity of its own, so suite fixtures that stage
        # refusal records depend on an ambient identity that stock hosted
        # runners do not provide. Pin one deterministic fixture identity
        # per leg instead of relying on whatever each runner image carries.
        run: |
          git config --global user.email "parley-ci@example.invalid"
          git config --global user.name "parley-ci"
      - name: Enable long paths (Windows)
        # release-ci-claude-1 Finding C: the longest deck record path is
        # 233 chars; under the D:\a\parley-deck-cli\parley-deck-cli\
        # workspace prefix it exceeds MAX_PATH 260 and the checkout itself
        # fails, so this must run before actions/checkout. No-op elsewhere.
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Windows cross-compile guard
        # AC-BLD-2 (FINAL §D.8): compile-only evidence that the tree builds
        # for windows/amd64 and windows/arm64. Never execution evidence; no
        # ARM64 gate is added and no ARM64 execution is claimed anywhere.
        if: runner.os == 'Linux'
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=arm64 go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        # Fix-up G3 (claude-1 R2-MAJ-3): an explicit timeout, at or above the 2400s
        # every green record in the lean-organizer idea uses. Go's 10m per-package
        # default left internal/trajectory (589.7s) and internal/app (521.7s) ~2%
        # from timing out on the dev machine, and a no-flag run failed there — a
        # leg configured to time out does not deliver the honest Windows coverage
        # FINAL risk 8 claims for it.
        run: go test ./... -count=1 -timeout 45m
