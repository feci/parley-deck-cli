name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: go build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The Windows leg is load-bearing for the portable verbs added by
        # lean-organizer: `parley wait` (bounded portable polling — no fsnotify)
        # and `parley usage ingest` (streaming path-only ingest) must hold on
        # Windows so releases ship Windows assets honestly.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        # Fix-up G3 (claude-1 R2-MAJ-3): an explicit timeout, at or above the 2400s
        # every green record in the lean-organizer idea uses. Go's 10m per-package
        # default left internal/trajectory (589.7s) and internal/app (521.7s) ~2%
        # from timing out on the dev machine, and a no-flag run failed there — a
        # leg configured to time out does not deliver the honest Windows coverage
        # FINAL risk 8 claims for it.
        run: go test ./... -count=1 -timeout 45m
