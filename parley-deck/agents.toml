# Shared Parley Deck agent runtime defaults for this repository.
# User-local paths and overrides belong in parley-deck/agents.local.toml.

[agents.codex]
sandbox_mode = "workspace-write"
approval_policy = "on-failure"
model = "cli-default"
reasoning = "cli-default"
profile = "cli-default"
speed = "balanced"
timeout_ms = 1800000
external_backend = "hosted"

[agents.claude]
model = "opus"
reasoning = "max"
profile = "cli-default"
speed = "balanced"
timeout_ms = 1800000
external_backend = "hosted"

# Antigravity CLI (agy) is the active Gemini-family participant; the legacy
# `gemini` CLI has been retired from the roster. agy 1.0.5 exposes `--model`;
# use the best available Gemini model.
[agents.agy]
model = "Gemini 3.5 Flash (High)"
reasoning = "cli-default"
profile = "cli-default"
speed = "deep"
timeout_ms = 1800000
external_backend = "hosted"
approval_policy = "dangerously-skip-permissions"
notes = "Antigravity CLI; headless `agy --print-timeout 30m --dangerously-skip-permissions --model \"Gemini 3.5 Flash (High)\" -p <prompt>`. Models: agy models (Gemini 3.5 Flash Low/Med/High, Gemini 3.1 Pro Low/High)."

[agents.hermes]
model = "glm-5p2"
# Override the built-in headless args (which hardcode --model xai/grok-4.3) so the
# actual invocation runs GLM 5.2. Keep {prompt} (runner-substituted) and --accept-hooks.
headless_args = ["--oneshot", "{prompt}", "--model", "glm-5p2", "--accept-hooks"]
reasoning = "cli-default"
profile = "cli-default"
speed = "balanced"
timeout_ms = 1800000
isolate_home = true
external_backend = "hosted"
approval_policy = "accept-hooks"

[agents.hermes.isolated_home_env]
HERMES_HOME = "{tempdir}"
