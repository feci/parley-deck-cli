# Protocol packet applicability map — parley-deck/COOPERATION.md
#
# Ratified by ideas/meta-protocol-change-phase-packet-and-fixup-budget/FINAL.md ("Never cut")
# and ideas/meta-protocol-change-evidence-first-efficiency/FINAL.md (D4, "Packet Never-Cut").
#
# THIS FILE IS PROTOCOL. Changing a classification is a §7 protocol change and needs a
# meta-protocol-change idea; no generator can prove a classification is semantically right.
# The conservative default is `always`. `parley protocol packet check` proves only structure:
# every heading block of the live source is classified exactly once, every conditional entry
# names the trigger that requires reading the full source, every `requires` resolves, and the
# never-cut list below is honored. A heading with no entry is UNKNOWN applicability: it is
# included, `packet check` fails, and an optimized packet falls back to full context.
#
# Locator = the heading line, whitespace-collapsed (a repeated heading gets " #2").
# include: always | when | on-demand.  `when` lists phases/tracks/transports/flags (any match
# includes).  Known flags: protocol_change (derived from a meta-protocol-change-* slug),
# strict_gate, auto_implement, pipeline.
